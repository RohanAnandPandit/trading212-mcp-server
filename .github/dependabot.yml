version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Transitive packages are upgraded through their direct parent so uv can
    # preserve exact parent/child constraints in the lockfile and export.
    allow:
      - dependency-type: direct
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # Exact child versions are controlled by these packages' public parents.
      # Standalone updates make uv.lock disagree with the generated export.
      - dependency-name: mcp-types
      - dependency-name: pydantic-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
